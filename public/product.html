<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MAISON VERDANT — Article</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="icon" type="image/x-icon" href="../public_/images,backend/Favicon-MV.png">
  <link rel="stylesheet" href="product.css">
  <style>
    .api-error-banner { display: none; margin: 0 40px 20px; padding: 12px 20px; background: #fdf2f2; border: 1px solid #f5c6c6; border-left: 3px solid #c0392b; font-size: 0.78rem; color: #c0392b; }
    .api-error-banner.visible { display: flex; align-items: center; gap: 10px; }
    .api-error-banner a { color: #c0392b; margin-left: auto; font-size: 0.72rem; }
    .stock-badge { display: inline-block; padding: 4px 10px; font-size: 0.65rem; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 16px; }
    .stock-in  { background: #e8f5e9; color: #2e7d32; }
    .stock-out { background: #fdf2f2; color: #c0392b; }
    .cart-confirm { display: none; padding: 12px 16px; background: #e8f5e9; border: 1px solid #a5d6a7; border-left: 3px solid #2e7d32; font-size: 0.78rem; color: #2e7d32; margin-bottom: 12px; }
    .cart-confirm.visible { display: block; }
    @media (max-width: 600px) { .api-error-banner { margin: 0 20px 16px; } }
  </style>
</head>
<body>
  <header>
    <a href="index.html" class="logo">Maison Verdant</a>
    <nav><ul class="header-nav">
      <li><a href="index.html">Collection</a></li>
      <li><a href="#">Lookbook</a></li>
      <li><a href="#">A propos</a></li>
      <li><a href="#">Contact</a></li>
    </ul></nav>
  </header>

  <div class="breadcrumb">
    <a href="index.html">Collection</a>
    <span class="sep">/</span>
    <span id="breadcrumbName">Chargement...</span>
  </div>

  <!-- ERREUR API -->
  <div class="api-error-banner" id="apiErrorBanner">
    <span id="apiErrorMsg"></span>
    <a href="index.html">Retour a la collection</a>
  </div>

  <div id="loadingState" class="loading-state"><span>Chargement de l'article...</span></div>
  <div id="errorState" class="error-state">
    <p>Article introuvable</p>
    <span id="errorDetail"></span>
    <a href="index.html" class="btn-back" style="max-width:240px;margin-top:8px">Retour a la collection</a>
  </div>

  <div id="productContent" style="display:none">
    <div class="product-layout">
      <div class="product-gallery">
        <div class="main-image" id="mainImage"></div>
      </div>
      <div class="product-details">
        <div style="display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-bottom:4px">
          <div id="collabBadge" class="collab-badge" style="display:none">Edition limitee</div>
          <div id="stockBadge" class="stock-badge"></div>
        </div>
        <div class="product-tag" id="productType"></div>
        <h1 class="product-title" id="productTitle"></h1>
        <div class="product-brand-line" id="productBrand"></div>
        <div class="product-price" id="productPrice"></div>
        <div class="info-grid">
          <div class="info-cell"><div class="info-label">Origine</div><div class="info-value" id="infoRegion"></div></div>
          <div class="info-cell"><div class="info-label">Marque</div><div class="info-value" id="infoBrand"></div></div>
          <div class="info-cell"><div class="info-label">Reference</div><div class="info-value" id="infoRef"></div></div>
          <div class="info-cell"><div class="info-label">Disponibilite</div><div class="info-value" id="infoStock"></div></div>
        </div>
        <p class="product-description" id="productDesc"></p>
        <div class="cart-confirm" id="cartConfirm">Article ajoute au panier.</div>
        <button class="btn-add" id="btnAdd" onclick="addToCart()">Ajouter au panier</button>
        <a href="index.html" class="btn-back">Retour a la collection</a>
      </div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const productId = parseInt(params.get('id'));

    const descriptions = [
      "Une piece taillee dans un coton oxford de premiere qualite, au grammage genereux. La coupe s'inspire des archives des annees 1960, revisitee avec une aisance contemporaine.",
      "Confectionnee a la main dans les ateliers historiques de Lyon, cette cravate en soie pure exprime une elegance discrete et sure. Le noeud glisse avec une facilite remarquable.",
      "Construite sur une toile de lin interlignee, cette veste adopte une silhouette ajustee qui preserve sa structure au fil des heures.",
      "Le lin portugais, recolte et file dans la region de l'Alentejo, offre une texture legerement irreguliere qui constitue tout le caractere de cette chemise.",
      "Piece de collection realisee en collaboration avec un artisan japonais specialise dans les broderies a l'aiguille d'or.",
    ];

    async function loadProduct() {
      if (!productId || isNaN(productId)) { showError('Identifiant manquant dans l\'URL.'); return; }
      try {
        const res = await fetch(`/api/products/${productId}`);
        if (res.status === 404) { showError(`Aucun article avec l'identifiant ${productId}.`); return; }
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.error || `Erreur serveur (${res.status})`);
        }
        renderProduct(await res.json());
      } catch (e) {
        document.getElementById('apiErrorMsg').textContent = `Erreur : ${e.message}. Données de secours affichées.`;
        document.getElementById('apiErrorBanner').classList.add('visible');
        const fallback = [
          { id: 1,  name: "Chemise Oxford No. 4",       type: "Chemise",    brand: "Verdant",       region: "France",     price: 145, collab: false, stock: 10, image: "" },
          { id: 2,  name: "Cravate Soie Vert Nuit",     type: "Cravate",    brand: "Leclaire",      region: "France",     price: 89,  collab: false, stock: 10, image: "" },
          { id: 3,  name: "Veste Ceremony",             type: "Veste",      brand: "Moreau & Fils", region: "Italie",     price: 490, collab: false, stock: 10, image: "" },
          { id: 4,  name: "Chemise Lin Blanc Brut",     type: "Chemise",    brand: "Archipel",      region: "Portugal",   price: 110, collab: false, stock: 10, image: "" },
          { id: 5,  name: "Pochette Argent Vol.1",      type: "Accessoire", brand: "Verdant",       region: "Japon",      price: 55,  collab: true,  stock: 3,  image: "" },
          { id: 6,  name: "Chemise Popeline Noire",     type: "Chemise",    brand: "Verdant",       region: "France",     price: 130, collab: false, stock: 10, image: "" },
          { id: 7,  name: "Pantalon Flanelle Gris",     type: "Pantalon",   brand: "Moreau & Fils", region: "Angleterre", price: 210, collab: false, stock: 10, image: "" },
          { id: 8,  name: "Cravate Rayee Bordeaux",     type: "Cravate",    brand: "Leclaire",      region: "Italie",     price: 75,  collab: false, stock: 10, image: "" },
          { id: 9,  name: "Chemise Madras x Archipel",  type: "Chemise",    brand: "Archipel",      region: "Japon",      price: 175, collab: true,  stock: 2,  image: "" },
          { id: 10, name: "Boutons de manchette Noirs", type: "Accessoire", brand: "Verdant",       region: "France",     price: 45,  collab: false, stock: 10, image: "" },
          { id: 11, name: "Chemise Coton Sea Island",   type: "Chemise",    brand: "Moreau & Fils", region: "Angleterre", price: 225, collab: false, stock: 10, image: "" },
          { id: 12, name: "Veste Tweed Ecossais",       type: "Veste",      brand: "Leclaire",      region: "Angleterre", price: 540, collab: false, stock: 10, image: "" },
          { id: 13, name: "Ceinture Cuir Naturel",      type: "Accessoire", brand: "Archipel",      region: "Portugal",   price: 95,  collab: false, stock: 10, image: "" },
          { id: 14, name: "Chemise Denim Delave",       type: "Chemise",    brand: "Verdant",       region: "Japon",      price: 160, collab: false, stock: 10, image: "" },
          { id: 15, name: "Pantalon Chino Ivoire",      type: "Pantalon",   brand: "Archipel",      region: "Portugal",   price: 185, collab: false, stock: 10, image: "" },
          { id: 16, name: "Pochette Soie x Moreau",     type: "Accessoire", brand: "Moreau & Fils", region: "Italie",     price: 65,  collab: true,  stock: 4,  image: "" },
        ];
        const p = fallback.find(p => p.id === productId);
        if (p) renderProduct(p); else showError(`Article ${productId} introuvable.`);
      }
    }

    function renderProduct(p) {
      // Compatibilite : la BDD renvoie outfit_name + origine, le fallback renvoie name + region
      const name   = p.name   || p.outfit_name || '';
      const region = p.region || p.origine     || '';

      document.title = `${name} — Maison Verdant`;
      document.getElementById('breadcrumbName').textContent = name;
      document.getElementById('productType').textContent    = p.type;
      document.getElementById('productTitle').textContent   = name;
      document.getElementById('productBrand').textContent   = p.brand;
      document.getElementById('productPrice').textContent   = `${p.price} EUR`;
      document.getElementById('infoRegion').textContent     = region;
      document.getElementById('infoBrand').textContent      = p.brand;
      document.getElementById('infoRef').textContent        = `MV-${String(p.id).padStart(4, '0')}`;
      document.getElementById('productDesc').textContent    = descriptions[(p.id - 1) % descriptions.length];

      // Badge stock
      const stockVal  = p.stock ?? 10;
      const stockBadge = document.getElementById('stockBadge');
      const btnAdd     = document.getElementById('btnAdd');
      if (stockVal > 0) {
        stockBadge.className = 'stock-badge stock-in';
        stockBadge.textContent = 'En stock';
        document.getElementById('infoStock').textContent = `${stockVal} disponible${stockVal > 1 ? 's' : ''}`;
        btnAdd.disabled = false;
      } else {
        stockBadge.className = 'stock-badge stock-out';
        stockBadge.textContent = 'Rupture de stock';
        document.getElementById('infoStock').textContent = 'Indisponible';
        btnAdd.disabled = true;
        btnAdd.textContent = 'Indisponible';
      }

      const mainImg = document.getElementById('mainImage');
      mainImg.innerHTML = p.image
        ? `<img src="${p.image}" alt="${name}"/>`
        : `<div class="img-placeholder-large"><span>${name.charAt(0)}</span></div>`;

      if (p.collab) document.getElementById('collabBadge').style.display = 'inline-block';

      document.getElementById('loadingState').style.display = 'none';
      document.getElementById('productContent').style.display = 'block';
    }

    function showError(detail) {
      document.getElementById('loadingState').style.display = 'none';
      document.getElementById('errorDetail').textContent = detail || '';
      document.getElementById('errorState').classList.add('visible');
    }

    function addToCart() {
      const confirm = document.getElementById('cartConfirm');
      confirm.classList.add('visible');
      setTimeout(() => confirm.classList.remove('visible'), 3000);
    }

    loadProduct();
  </script>
</body>
</html>
